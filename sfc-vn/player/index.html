<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>十一点的城市</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <div id="screen">
      <img id="bg" alt="" />
      <img id="portrait" alt="" />
      <div id="place"></div>
      <div id="box">
        <div id="who"></div>
        <div id="text"></div>
        <div id="hint"></div>
      </div>
      <div id="overlay" class="hidden">
        <div id="panel"></div>
      </div>
    </div>
    <p class="help">Z／空格／点击：确认　↑↓：选项　Esc／Enter：菜单（随时存读档）</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
