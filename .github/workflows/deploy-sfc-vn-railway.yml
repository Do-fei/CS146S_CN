name: Deploy SFC-VN to Railway

on:
  push:
    branches:
      - main
      - cursor/sfc-visual-novel-f6c3
    paths:
      - "sfc-vn/**"
      - ".github/workflows/deploy-sfc-vn-railway.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfc-vn
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://railway.com/install.sh | sh

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::notice::跳过 Railway CLI 部署。请在 Railway Dashboard 连 GitHub，或配置 RAILWAY_TOKEN + RAILWAY_SERVICE_ID。"
            exit 0
          fi
          railway redeploy --service "$RAILWAY_SERVICE_ID" --yes
